name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # The app is WinForms and the tests exercise Windows ACLs and Restart Manager,
    # so there is no useful cross-platform leg to run.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DiskSpace.slnx

      # ContinuousIntegrationBuild turns warnings into errors — see Directory.Build.props.
      - name: Build
        run: dotnet build DiskSpace.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >
          dotnet test DiskSpace.slnx -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results

      - name: Publish
        run: ./build.ps1 Publish -Configuration Release
        shell: pwsh

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: DiskSpace-win-x64
          path: artifacts/publish/DiskSpace.exe
